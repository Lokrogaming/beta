<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="developer" content="https://htmlhoster.lovable.app">
    <title>BG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00e5;
            --neon-purple: #7000ff;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Animated Background Orbs */
        .orb-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            filter: blur(80px);
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--neon-cyan);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: var(--neon-magenta);
            bottom: -150px;
            right: -50px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: var(--neon-purple);
            top: 40%;
            left: 50%;
            animation-delay: -10s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(100px, 50px) scale(1.2); }
            66% { transform: translate(-50px, 150px) scale(0.8); }
        }

        /* Main Content */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            padding: 3rem;
            border-radius: 24px;
            text-align: center;
            max-width: 600px;
            width: 90%;
            z-index: 10;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display:none;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px 0 rgba(0, 242, 255, 0.2);
            border-color: rgba(0, 242, 255, 0.3);
        }

        h1 {
            font-family: 'Syncopate', sans-serif;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 1.5rem;
            background: linear-gradient(to right, #fff, var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        /* Bouncing Interactive Elements */
        .elements-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .floating-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: bounce 4s infinite ease-in-out;
        }

        .floating-item:nth-child(2) { animation-delay: 0.5s; }
        .floating-item:nth-child(3) { animation-delay: 1s; }

        .floating-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: scale(1.1) translateY(-10px);
            border-color: var(--neon-magenta);
            box-shadow: 0 0 20px rgba(255, 0, 229, 0.4);
        }

        .icon {
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: block;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .btn {
            display: inline-block;
            margin-top: 2rem;
            padding: 12px 32px;
            background: transparent;
            color: white;
            border: 1px solid var(--neon-cyan);
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.6);
            transform: scale(1.05);
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; letter-spacing: 4px; }
            .elements-grid { grid-template-columns: 1fr; }
            .glass-card { padding: 2rem; }
        }
    </style>
</head>
<body>

    <div class="orb-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    

</body>
</html>
